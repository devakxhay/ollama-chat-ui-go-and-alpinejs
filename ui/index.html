<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950 text-zinc-100">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama Chat UI</title>

  <script src="/app.js" defer></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- AlpineJS -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Custom thin scrollbar styling */
    .chat-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .chat-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(63, 63, 70, 0.4);
      border-radius: 9999px;
    }

    .chat-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: rgba(82, 82, 91, 0.6);
    }
  </style>
</head>

<body x-data="chatApp"
  class="h-full flex flex-col justify-between max-w-5xl mx-auto px-4 sm:px-6 py-6 md:py-8 bg-zinc-950">
  <!-- Header -->
  <header class="flex items-center justify-between pb-4 border-b border-zinc-900">
    <div class="flex items-center gap-3">
      <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></div>
      <h1 class="text-sm font-semibold tracking-wide text-zinc-200 uppercase">Ollama Chat</h1>
    </div>

    <div class="flex items-center gap-4">
      <span class="text-xs text-zinc-500 font-medium" x-text="model ? model : 'gemma3:270m'"></span>
      <!-- Settings toggle button -->
      <button @click="showSettings = !showSettings"
        class="p-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/60 transition-all duration-150 cursor-pointer"
        title="Toggle parameters">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
          </path>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Workspace Container (Sidebar + Chat Area) -->
  <div class="flex-1 flex gap-6 overflow-hidden my-4 relative">

    <!-- Sidebar Settings Panel -->
    <aside x-show="showSettings" x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 -translate-x-4" x-transition:enter-end="opacity-100 translate-x-0"
      x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-x-0"
      x-transition:leave-end="opacity-0 -translate-x-4"
      class="w-64 flex-shrink-0 bg-zinc-900/30 border border-zinc-900 rounded-2xl p-4 flex flex-col gap-5 self-stretch overflow-y-auto"
      style="display: none;">


      <!-- Model Selection Dropdown -->
      <div class="mb-4">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Model</label>
        <div class="relative">
          <select x-model="model"
            class="w-full h-10 px-3 text-sm bg-slate-950/40 border border-slate-800/80 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition-all appearance-none cursor-pointer text-slate-100">
            <option value="Select Model" disabled selected>Select Model</option>
            <template x-for="model in models">
              <option :value="model.name" x-text="model.name + ' - ' + model.details.parameter_size"
                class="bg-slate-900 text-slate-100"></option>
            </template>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
        </div>
      </div>

      <div class="border-b border-zinc-900 pb-3">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Parameters</h2>
      </div>

      <!-- Temperature slider -->
      <div class="flex flex-col gap-2">
        <div class="flex justify-between items-center">
          <label for="temp-input" class="text-xs text-zinc-400 font-medium">Temperature</label>
          <span class="text-xs text-zinc-500 font-mono" x-text="temperature"></span>
        </div>
        <input id="temp-input" type="range" min="0" max="1" step="0.1" x-model="temperature"
          class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-zinc-400">
      </div>

      <!-- Max Predict Tokens -->
      <div class="flex flex-col gap-2">
        <label for="max-token-input" class="text-xs text-zinc-400 font-medium">Max Predict Tokens</label>
        <input id="max-token-input" type="number" x-model="maxToken" min="1" max="2048" step="1"
          class="w-full h-9 px-3 bg-zinc-900 border border-zinc-800 text-xs text-zinc-200 rounded-lg focus:outline-none focus:border-zinc-700 transition-colors">
      </div>

      <!-- Context Window -->
      <div class="flex flex-col gap-2">
        <label for="ctx-window-input" class="text-xs text-zinc-400 font-medium">Context Window</label>
        <input id="ctx-window-input" type="number" x-model="contextWindow" min="256" max="32768" step="256"
          class="w-full h-9 px-3 bg-zinc-900 border border-zinc-800 text-xs text-zinc-200 rounded-lg focus:outline-none focus:border-zinc-700 transition-colors">
      </div>
    </aside>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col justify-between overflow-hidden">
      <!-- Chat Area -->
      <main class="flex-1 overflow-y-auto pr-2 chat-scrollbar space-y-6">
        <template x-if="messages.length === 0">
          <div class="h-full flex flex-col items-center justify-center text-center py-20">
            <div class="w-12 h-12 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center mb-4">
              <svg class="w-6 h-6 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z">
                </path>
              </svg>
            </div>
            <h2 class="text-sm font-medium text-zinc-300">No messages yet</h2>
            <p class="text-xs text-zinc-500 mt-1">Start a conversation with Ollama locally.</p>
          </div>
        </template>

        <div class="space-y-6">
          <template x-for="msg in messages">
            <div class="flex" :class="msg.role === 'user' ? 'justify-end' : 'justify-start'">
              <div class="max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-relaxed transition-all duration-200" :class="msg.role === 'user' 
                  ? 'bg-zinc-800 text-zinc-100 shadow-sm border border-zinc-700/50' 
                  : 'bg-zinc-900/40 text-zinc-300 border border-zinc-900 shadow-inner'">
                <p class="whitespace-pre-wrap" x-text="msg.content"></p>
              </div>
            </div>
          </template>

          <!-- Typing indicator -->
          <template x-if="loading">
            <div class="flex justify-start">
              <div class="bg-zinc-900/40 border border-zinc-900 rounded-2xl px-4 py-3 text-sm">
                <span class="inline-flex gap-1.5 items-center">
                  <span class="w-1.5 h-1.5 bg-zinc-500 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
                  <span class="w-1.5 h-1.5 bg-zinc-500 rounded-full animate-bounce"
                    style="animation-delay: 150ms"></span>
                  <span class="w-1.5 h-1.5 bg-zinc-500 rounded-full animate-bounce"
                    style="animation-delay: 300ms"></span>
                </span>
              </div>
            </div>
          </template>
        </div>
      </main>

      <!-- Input Footer -->
      <footer class="pt-4 border-t border-zinc-900 bg-zinc-950">
        <div class="flex gap-3">
          <div class="flex-1 relative">
            <input type="text" placeholder="Ask anything..." x-model="userInput" @keydown.enter="sendMessage()"
              class="w-full h-11 pl-4 pr-4 bg-zinc-900/50 border border-zinc-800 text-zinc-100 text-sm rounded-xl focus:outline-none focus:border-zinc-700 focus:ring-1 focus:ring-zinc-700 transition-all duration-200 placeholder-zinc-500">
          </div>
          <div>
            <button @click="sendMessage()"
              class="h-11 px-5 bg-zinc-100 text-zinc-900 text-sm font-medium rounded-xl hover:bg-zinc-200 active:scale-[0.98] focus:outline-none transition-all duration-150 cursor-pointer flex items-center justify-center">
              Send
            </button>
          </div>
        </div>
      </footer>
    </div>

  </div>
</body>

</html>
